services:
  capstone-react:
    build:
      context: .
      dockerfile: Dockerfile
    image: capstone-react:latest
    container_name: capstone-react-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - capstone-network

networks:
  capstone-network:
    driver: bridge
